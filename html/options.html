<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InboxAssist Settings</title>
  <link href="../css/popup.css" rel="stylesheet" />
</head>
<body>
  <main class="app" style="min-height: auto;">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">IA</div>
        <span class="brand-name">InboxAssist Settings</span>
      </div>
    </header>
    <section class="view active">
      <div class="view-inner">
        <h2 class="view-title">Configuration</h2>
        <p class="view-subtitle">Prototype settings</p>
        <div class="card">
          <div class="card-label">Microsoft OAuth</div>
          <p id="microsoft-status" role="status">Checking connection…</p>
          <button class="btn-primary" id="btn-options-auth">Sign in with Microsoft</button>
          <button class="btn-primary" id="btn-options-signout" hidden>Disconnect Microsoft</button>
        </div>
        <div class="card">
          <div class="card-label">Redirect URI</div>
          <p id="redirect-uri">Loading…</p>
          <p class="view-subtitle">Register this exact URI in Microsoft Entra for the extension.</p>
        </div>
        <p id="status" role="status">Gemini settings will be added in the next slice.</p>
      </div>
    </section>
  </main>
  <script src="../js/options.js"></script>
</body>
</html>
