<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InboxAssist Settings</title>
  <link href="../css/popup.css" rel="stylesheet" />
</head>
<body>
  <main class="app" style="min-height: auto;">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">IA</div>
        <span class="brand-name">InboxAssist Settings</span>
      </div>
    </header>
    <section class="view active">
      <div class="view-inner">
        <h2 class="view-title">Configuration</h2>
        <p class="view-subtitle">Prototype settings</p>
        <p>Microsoft login and Gemini configuration will be added in the next slice.</p>
        <p id="status" role="status">Settings are ready.</p>
      </div>
    </section>
  </main>
  <script src="../js/options.js"></script>
</body>
</html>
